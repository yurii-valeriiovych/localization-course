<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Демо Локалізації</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 30px; border-radius: 15px; }
        .lang-switch { margin-bottom: 20px; }
        button { background: #38bdf8; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; }
        .card { background: #334155; padding: 20px; border-radius: 10px; text-align: left; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-switch">
            <button onclick="loadLanguage('uk')">UA (Оригінал)</button>
            <button onclick="loadLanguage('en')">EN (Завантажити переклад)</button>
        </div>

        <h1 id="title">Практичні аспекти перекладу та локалізації</h1>
        
        <div class="card">
            <h3 id="h_struct">Структура курсу</h3>
            <p id="res_text">Словники, професійні довідники та глосарії для студентів.</p>
        </div>
    </div>

    <script>
        async function loadLanguage(lang) {
            try {
                // Сайт намагається відкрити файл uk.json або en.json
                const response = await fetch(lang + '.json');
                if (!response.ok) throw new Error('Файл не знайдено! Спершу зробіть переклад у Crowdin.');
                const translations = await response.json();
                
                // Оновлюємо текст на сторінці даними з файлу
                document.getElementById('title').innerText = translations.title;
                document.getElementById('h_struct').innerText = translations.h_struct;
                document.getElementById('res_text').innerText = translations.res_text;
                
                alert('Мову змінено на: ' + lang.toUpperCase());
            } catch (error) {
                alert(error.message);
            }
        }
    </script>
</body>
</html>
